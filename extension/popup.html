<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <div class="status-orb" id="statusOrb"></div>
      <span class="nav-brand" data-i18n="navBrand">AI Energy Monitor</span>
    </div>
    <span class="status-label" id="statusLabel"></span>
  </nav>

  <!-- Onboarding (wird ausgeblendet sobald Ordner verbunden) -->
  <div id="onboarding" class="onboarding hidden">
    <div class="ob-icon">📂</div>
    <div class="ob-title" data-i18n="obTitle">Speicherort einrichten</div>
    <div class="ob-desc" data-i18n="obDesc">Wähle deinen Dokumente-Ordner – der Ordner 'KI Energie-Monitor' wird automatisch darin angelegt.</div>
    <button id="btnChooseFolder" class="btn btn-dashboard" data-i18n="obChooseFolder">Dokumente öffnen</button>
    <div class="ob-note" data-i18n="obNote">Der Ordner 'KI Energie-Monitor' wird automatisch erstellt</div>
    <div class="ob-error hidden" id="obError" data-i18n="obError">Kein Ordner ausgewaehlt. Bitte versuche es erneut.</div>
  </div>

  <div id="mainContent" class="container hidden">

    <!-- Daily total -->
    <div class="stat-main">
      <div class="stat-num-wrap">
        <span class="stat-num" id="todayWh">0.0</span>
        <span class="stat-unit">Wh</span>
      </div>
      <span class="stat-sub" data-i18n="whToday">today</span>
    </div>

    <!-- Week chart -->
    <div class="week-section">
      <div class="week-header">
        <span class="section-label" data-i18n="currentWeek">Current week</span>
        <span class="week-total"><strong id="weekWh">0</strong> Wh</span>
      </div>
      <div class="week-days" id="weekDays"></div>
      <canvas id="weekChart" height="60" style="width:100%;display:block;margin-top:4px;"></canvas>
    </div>

    <!-- Service breakdown -->
    <table class="breakdown" id="serviceList"></table>

    <!-- Last request with IN/OUT token badges -->
    <div class="last-prompt" id="lastPromptSection">
      <div class="section-label" data-i18n="lastPrompt">Last request</div>
      <div class="last-prompt-text" id="lastPromptText"></div>
      <div class="token-badges" id="lastPromptMeta"></div>
    </div>

    <!-- Dashboard -->
    <button id="openDashboard" class="btn btn-dashboard" data-i18n="dashboardBtn">Zum Dashboard</button>

    <!-- Settings -->
    <div class="btn-row">
      <button id="openDevTest" class="btn btn-settings" data-i18n="settingsBtn">Settings</button>
    </div>

  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>

</body>
</html>
